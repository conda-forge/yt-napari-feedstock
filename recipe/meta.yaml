{% set name = "yt-napari" %}
{% set version = "0.6.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/yt_napari-{{ version }}.tar.gz
  sha256: fb125fe041abff47f7a4e91620c98b667a7ae7a8e51c8444afbbd0200f7e4190

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >={{ python_min }}
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - magicgui >=0.6.1
    - napari >=0.4.19
    - numpy
    - packaging
    - pydantic >2.0
    - python >={{ python_min }}
    - qtpy
    - unyt
    - yt >=4.0.1

test:
  imports:
    - yt_napari
  commands:
    - pip list
    - pip check
  requires:
    - python {{ python_min }}  
    - pip

about:
  home: https://pypi.org/project/yt-napari
  summary: A napari plugin for loading data from yt
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/data-exp-lab/yt-napari

extra:
  recipe-maintainers:
    - chrishavlin
    - jaimergp
